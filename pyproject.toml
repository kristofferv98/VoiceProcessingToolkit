[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VoiceProcessingToolkit"
version = "2.0.0"
description = "A toolkit for voice processing tasks, including wake word detection, voice recording, and transcription"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Kristoffer Vatnehol", email = "kristoffervatnehol@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pyaudio~=0.2.14",
    "python-dotenv~=1.0.1",
    "requests~=2.32.3",
    "elevenlabs~=1.52.0",
    "numpy~=2.2.3",
    "pvcobra~=2.0.5",
    "pvkoala~=2.0.4",
    "pvporcupine~=3.0.5",
    "pygame~=2.6.1",
    "termcolor~=2.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "isort>=5.0.0"
]

[project.urls]
"Homepage" = "https://github.com/kristofferv98/VoiceProcessingToolkit"
"Bug Tracker" = "https://github.com/kristofferv98/VoiceProcessingToolkit/issues"
"Documentation" = "https://github.com/kristofferv98/VoiceProcessingToolkit/README.md"

[tool.setuptools]
packages = ["VoiceProcessingToolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100 
